services:
  libretv:
    build:
      context: .
      dockerfile: Dockerfile
    # 本地源码构建的镜像；更新上游后执行 ./scripts/update-from-upstream.sh
    image: ${LIBRETV_IMAGE:-libretv-local:latest}
    container_name: libretv
    restart: unless-stopped
    ports:
      - "8899:8080"
    environment:
      - PASSWORD=${PASSWORD:?请在 .env 中设置 PASSWORD}
      - PROXY_SECRET=${PROXY_SECRET}
      - NODE_ENV=production
      - DEFAULT_SOURCES=${DEFAULT_SOURCES}
      - DEFAULT_SUBSCRIPTIONS=${DEFAULT_SUBSCRIPTIONS}
      - DEFAULT_RECOMMEND_SOURCE=${DEFAULT_RECOMMEND_SOURCE:-douban}
